schema: spec-driven


operations:
  apply:
    guidance:
      - 连续执行当前 Change 的全部任务，不要逐项等待用户确认。
      - 普通代码修改、文件创建、测试和 Bug 修复均自主完成。
      - 每完成一个任务，立即更新 tasks.md 的复选框。
      - 测试失败时自主分析、修复并重新测试。
      - 每个模块完成后运行相关测试和代码检查。
      - 不得擅自改变已确认的需求、设计和技术架构。
      - 仅在需求冲突、必要授权缺失或无法解决的阻塞时询问用户。
      - 不得执行生产环境破坏性操作或未经授权的数据删除。
      - 所有任务完成后汇总实施结果、测试结果和遗留问题。

