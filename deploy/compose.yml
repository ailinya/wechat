name: ${STACK_NAME:-wetchat-release}

x-app: &app
  image: ${APP_IMAGE:-wetchat-api:local}
  env_file: ${APP_ENV_FILE:?Set APP_ENV_FILE to an absolute environment file}
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    rustfs: { condition: service_healthy }

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: wetchat
      POSTGRES_DB: ${POSTGRES_DB:-wetchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55439}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    shm_size: 256mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wetchat -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: [redis-server, --appendonly, 'yes']
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-}
    ports: ["127.0.0.1:${RUSTFS_API_PORT:-59000}:9000", "127.0.0.1:${RUSTFS_CONSOLE_PORT:-59001}:9001"]
    volumes: [rustfs_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    restart: 'no'
    command: [python, -m, app.commands.initialize]
  api:
    <<: *app
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: ${APP_TARGET:-runtime}
    command: [uvicorn, '${ASGI_APP:-app.asgi:app}', --host, 0.0.0.0, --port, '8000']
    ports: ["127.0.0.1:${API_PORT:-58019}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 12
  worker:
    <<: *app
    command: [celery, -A, '${CELERY_APP:-app.modules.async_execution.celery_app:celery_app}', worker, --loglevel, INFO, --concurrency, '2', -Q, 'async_jobs,celery']
    depends_on:
      migrate: { condition: service_completed_successfully }
  beat:
    <<: *app
    command: [celery, -A, '${CELERY_APP:-app.modules.async_execution.celery_app:celery_app}', beat, --loglevel, INFO, --schedule, /tmp/celerybeat-schedule]
    depends_on:
      migrate: { condition: service_completed_successfully }
  dispatcher:
    <<: *app
    command: [python, -m, app.commands.dispatch_outbox]
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    image: ${WEB_IMAGE:-wetchat-web:local}
    build: { context: .., dockerfile: frontend/Dockerfile }
    ports: ["127.0.0.1:${WEB_PORT:-55179}:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
