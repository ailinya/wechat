log_format safe_json escape=json '{"time":"$time_iso8601","event":"http.access","request_id":"$upstream_http_x_request_id","method":"$request_method","path":"$uri","status":$status,"duration_seconds":$request_time}';
# Request failures are recorded above without query strings; verbose upstream
# errors can otherwise repeat the original request URL with signed parameters.
error_log /dev/stderr crit;

server {
    access_log /dev/stdout safe_json;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_backend api:8000;
    client_max_body_size 20m;
    location /api/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
    location = /health { proxy_pass http://$api_backend; }
    location = /ready { proxy_pass http://$api_backend; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
